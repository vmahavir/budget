<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Manager - Firestore Admin</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

        .app-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 16px 24px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .app-header .container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .app-header .logo { display: flex; align-items: center; gap: 12px; }
        .app-header .logo i { font-size: 24px; color: #4fc3f7; background: rgba(79,195,247,0.15); padding: 8px 10px; border-radius: 10px; }
        .app-header .logo h1 { font-size: 20px; font-weight: 700; color: #fff; }
        .app-header .logo small { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 400; display: block; margin-top: -2px; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .user-badge { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; color: #fff; font-size: 13px; }
        .user-badge i { font-size: 14px; color: #4fc3f7; }

        .btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: linear-gradient(135deg, #4fc3f7, #2196f3); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(33,150,243,0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef5350, #d32f2f); color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(239,83,80,0.4); }
        .btn-success { background: linear-gradient(135deg, #66bb6a, #43a047); color: #fff; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(76,175,80,0.4); }
        .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
        .app-main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

        .login-section { max-width: 420px; margin: 40px auto; padding: 30px 32px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .login-section h2 { text-align: center; margin-bottom: 20px; color: #1a1a2e; font-size: 22px; }
        .login-section h2 i { color: #4fc3f7; }
        .login-section .form-group { margin-bottom: 14px; }
        .login-section .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
        .login-section .form-group input { width: 100%; padding: 10px 14px; border: 2px solid #e8ecf1; border-radius: 10px; font-size: 14px; transition: all 0.3s ease; }
        .login-section .form-group input:focus { outline: none; border-color: #4fc3f7; box-shadow: 0 0 0 3px rgba(79,195,247,0.15); }
        .login-section .btn { width: 100%; justify-content: center; margin-top: 8px; padding: 12px; }
        .login-section .btn-outline { color: #333; border-color: #ccc; background: #fafbfc; }
        .login-section .btn-outline:hover { background: #f0f2f5; }
        .login-section .error-message { color: #d32f2f; font-size: 13px; margin-top: 10px; text-align: center; }
        .login-section .divider { text-align: center; margin: 16px 0; color: #999; font-size: 13px; position: relative; }
        .login-section .divider::before, .login-section .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e8ecf1; }
        .login-section .divider::before { left: 0; }
        .login-section .divider::after { right: 0; }

        /* ===== NET WORTH STATS (mirrors app Dashboard) ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.04); }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .stat-card .stat-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 8px; }
        .stat-card .stat-icon.blue { background: #e3f2fd; color: #1976d2; }
        .stat-card .stat-icon.green { background: #e8f5e9; color: #388e3c; }
        .stat-card .stat-icon.orange { background: #fff3e0; color: #f57c00; }
        .stat-card .stat-icon.red { background: #ffebee; color: #d32f2f; }
        .stat-card .stat-icon.purple { background: #f3e5f5; color: #7b1fa2; }
        .stat-card .stat-icon.teal { background: #e0f2f1; color: #00695c; }
        .stat-card .stat-number { font-size: 24px; font-weight: 700; color: #1a1a2e; line-height: 1.2; }
        .stat-card .stat-label { font-size: 12px; color: #888; font-weight: 500; margin-top: 2px; }

        /* Net Worth hero card */
        .networth-hero {
            background: linear-gradient(135deg, #0F1D4B 0%, #1a2a5e 100%);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 16px;
            text-align: center;
            color: #fff;
            box-shadow: 0 6px 24px rgba(15,29,75,0.25);
        }
        .networth-hero .label { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); letter-spacing: 0.5px; }
        .networth-hero .value { font-size: 34px; font-weight: 800; margin: 6px 0 2px; }
        .networth-hero .delta { font-size: 12px; font-weight: 600; }

        .toolbar { background: #fff; border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04); }
        .toolbar .filter-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .toolbar select, .toolbar input { padding: 7px 12px; border: 2px solid #e8ecf1; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fafbfc; transition: all 0.3s ease; min-width: 120px; }
        .toolbar select:focus, .toolbar input:focus { outline: none; border-color: #4fc3f7; box-shadow: 0 0 0 3px rgba(79,195,247,0.15); }
        .toolbar .action-group { display: flex; gap: 6px; flex-wrap: wrap; }

        .table-container { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04); margin-bottom: 90px; }
        .table-header { padding: 14px 18px; background: #f8f9fc; border-bottom: 1px solid #e8ecf1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .table-header h3 { font-size: 15px; font-weight: 600; color: #1a1a2e; }
        .table-header .badge { background: #e8ecf1; padding: 3px 10px; border-radius: 16px; font-size: 11px; font-weight: 500; color: #666; }
        .table-wrapper { overflow-x: auto; padding: 0 2px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead { background: #f8f9fc; }
        table th { padding: 10px 14px; text-align: left; font-weight: 600; color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid #e8ecf1; white-space: nowrap; position: sticky; top: 0; background: #f8f9fc; z-index: 5; }
        table td { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; color: #333; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        table tr:hover td { background: #f8f9fc; }
        .doc-id { font-family: monospace; font-size: 11px; color: #666; background: #f0f2f5; padding: 2px 8px; border-radius: 4px; }
        .type-badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .type-badge.income { background: #e8f5e9; color: #2e7d32; }
        .type-badge.investment { background: #e3f2fd; color: #0d47a1; }
        .type-badge.cashflow { background: #fff8e1; color: #e65100; }
        .type-badge.temporary { background: #fff8e1; color: #e65100; }
        .type-badge.asset { background: #e0f2f1; color: #00695c; }
        .type-badge.liability { background: #ffebee; color: #c62828; }
        .type-badge.credit { background: #e8f5e9; color: #2e7d32; }
        .type-badge.debit { background: #ffebee; color: #c62828; }
        .type-badge.outflow { background: #ffebee; color: #c62828; }
        .table-actions { display: flex; gap: 4px; justify-content: center; }
        .table-actions .btn-icon { width: 28px; height: 28px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; font-size: 12px; background: transparent; color: #888; }
        .table-actions .btn-icon:hover { background: #f0f2f5; color: #333; }
        .table-actions .btn-icon.delete:hover { background: #ffebee; color: #d32f2f; }
        .table-actions .btn-icon.edit:hover { background: #e3f2fd; color: #1976d2; }

        .empty-state { text-align: center; padding: 50px 20px; color: #888; }
        .empty-state i { font-size: 40px; color: #ccc; margin-bottom: 12px; }
        .empty-state h3 { font-size: 17px; color: #555; margin-bottom: 6px; }
        .empty-state p { font-size: 13px; color: #999; }
        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; }
        .loading .spinner { width: 32px; height: 32px; border: 3px solid #e8ecf1; border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== FLOATING ACTION BUTTONS (mirror Android app) ===== */
        .fab-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: row;
            gap: 12px;
            z-index: 1500;
        }
        .fab {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            transition: all 0.25s ease;
        }
        .fab:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 26px rgba(0,0,0,0.3); }
        .fab:active { transform: translateY(-1px) scale(1); }
        .fab.primary { background: #0077b6; }
        .fab.quick { background: #e74a3b; }
        .fab.account { background: #1cc88a; }
        .fab .fab-label {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .fab:hover .fab-label { opacity: 1; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { transform: scale(0.95) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #e8ecf1; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; z-index: 10; border-radius: 16px 16px 0 0; }
        .modal-header h2 { font-size: 17px; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; border: none; border-radius: 50%; background: #f0f2f5; cursor: pointer; font-size: 16px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #ffebee; color: #d32f2f; }
        .modal-body { padding: 20px; }
        .modal-body .form-group { margin-bottom: 14px; }
        .modal-body .form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
        .modal-body .form-group input, .modal-body .form-group select, .modal-body .form-group textarea { width: 100%; padding: 8px 12px; border: 2px solid #e8ecf1; border-radius: 8px; font-size: 13px; font-family: inherit; transition: all 0.3s ease; background: #fafbfc; }
        .modal-body .form-group input:focus, .modal-body .form-group select:focus, .modal-body .form-group textarea:focus { outline: none; border-color: #4fc3f7; box-shadow: 0 0 0 3px rgba(79,195,247,0.15); }
        .modal-body .form-group textarea { min-height: 60px; resize: vertical; }
        .modal-body .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-footer { padding: 14px 20px; border-top: 1px solid #e8ecf1; display: flex; justify-content: flex-end; gap: 8px; }

        .toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
        .toast { padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,0.2); animation: slideIn 0.4s ease; display: flex; align-items: center; gap: 8px; }
        .toast.success { background: #43a047; }
        .toast.error { background: #d32f2f; }
        .toast.warning { background: #f57c00; }
        .toast.info { background: #1976d2; }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast .toast-close { margin-left: auto; background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 14px; }

        .info-box { background: #e3f2fd; padding: 12px 16px; border-radius: 8px; margin: 12px 0; font-size: 13px; color: #0d47a1; border-left: 4px solid #2196f3; }
        .info-box i { margin-right: 8px; }
        .info-box code { background: rgba(255,255,255,0.8); padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; }

        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 40px !important; }
        .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #999; cursor: pointer; font-size: 16px; }
        .password-toggle:hover { color: #333; }

        @media (max-width: 768px) {
            .app-header { padding: 12px 16px; }
            .app-header .logo h1 { font-size: 17px; }
            .app-main { padding: 12px 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 12px 14px; }
            .stat-card .stat-number { font-size: 20px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar .filter-group select, .toolbar .filter-group input { min-width: 100%; }
            .modal-body .form-row { grid-template-columns: 1fr; }
            .toast-container { left: 16px; right: 16px; bottom: 100px; }
            table { font-size: 12px; }
            table th, table td { padding: 6px 10px; }
            .networth-hero .value { font-size: 26px; }
            .fab-container { bottom: 16px; right: 16px; }
            .fab { width: 48px; height: 48px; font-size: 16px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card .stat-number { font-size: 17px; }
            .stat-card .stat-label { font-size: 11px; }
            .stat-card .stat-icon { width: 32px; height: 32px; font-size: 14px; }
            .header-actions .user-badge { font-size: 11px; padding: 4px 10px; }
            .login-section { padding: 20px; margin: 20px 10px; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f0f2f5; }
        ::-webkit-scrollbar-thumb { background: #c1c7cd; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8aeb4; }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-wallet"></i>
                <div>
                    <h1>Finance Manager</h1>
                    <small>Firestore Admin</small>
                </div>
            </div>
            <div class="header-actions">
                <div class="user-badge">
                    <i class="fas fa-user-circle"></i>
                    <span id="userDisplay">Not Signed In</span>
                </div>
                <button class="btn btn-outline btn-sm" onclick="toggleAuth()" id="authBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <button class="btn btn-primary btn-sm" onclick="refreshData()">
                    <i class="fas fa-sync"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="app-main">

        <!-- ===== LOGIN SECTION ===== -->
        <div id="loginSection">
            <div class="login-section">
                <h2><i class="fas fa-lock"></i> Sign In</h2>

                <div class="form-group" style="margin-top:16px;">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter password">
                        <button class="password-toggle" onclick="togglePasswordVisibility()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="handleSignIn()">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div class="divider">or</div>

                <button class="btn btn-outline" onclick="handleAnonymousSignIn()" style="color:#333;border-color:#ccc;background:#fafbfc;">
                    <i class="fas fa-user-secret"></i> Continue as Guest
                </button>

                <div id="loginError" class="error-message"></div>
            </div>
        </div>

        <!-- ===== APP CONTENT ===== -->
        <div id="appContent" style="display:none;">

            <!-- User Info -->
            <div class="info-box">
                <i class="fas fa-user"></i>
                <strong>User:</strong> <code id="currentUserEmail">-</code>
                <span style="margin-left:16px;">
                    <i class="fas fa-folder"></i>
                    <strong>User ID:</strong> <code id="currentUserId">-</code>
                </span>
            </div>

            <!-- ===== NET WORTH HERO + BREAKDOWN STATS ===== -->
            <div class="networth-hero">
                <div class="label">NET WORTH</div>
                <div class="value" id="netWorthValue">₹0</div>
                <div class="delta" id="netWorthDelta">— Positive</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-chart-line"></i></div>
                    <div class="stat-number" id="investmentTotal">₹0</div>
                    <div class="stat-label">Investment</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-university"></i></div>
                    <div class="stat-number" id="assetTotal">₹0</div>
                    <div class="stat-label">Asset</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><i class="fas fa-exchange-alt"></i></div>
                    <div class="stat-number" id="cashflowTotal">₹0</div>
                    <div class="stat-label">Cashflow</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red"><i class="fas fa-file-invoice-dollar"></i></div>
                    <div class="stat-number" id="liabilityTotal">₹0</div>
                    <div class="stat-label">Liability</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon teal"><i class="fas fa-wallet"></i></div>
                    <div class="stat-number" id="temporaryTotal">₹0</div>
                    <div class="stat-label">Temporary</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fas fa-layer-group"></i></div>
                    <div class="stat-number" id="totalAccounts">0</div>
                    <div class="stat-label">Accounts</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="filter-group">
                    <select id="collectionSelect" onchange="loadCollection()">
                        <option value="accounts">📊 Accounts</option>
                        <option value="transactions">💰 Transactions</option>
                        <option value="categories">🏷️ Categories</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="🔍 Search..." oninput="filterTable()">
                </div>
                <div class="action-group">
                    <button class="btn btn-success btn-sm" id="toolbarAddBtn" onclick="toolbarAddAction()">
                        <i class="fas fa-plus"></i> <span id="toolbarAddLabel">Add Account</span>
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="confirmDeleteAll()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3 id="collectionTitle">Accounts</h3>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIGURATION (Web App config for project budget-cf0cf)
        // ============================================================
        var firebaseConfig = {
            apiKey: "AIzaSyDAnxBnGpIlknvLvunq3aD_yXfHUHG9lm4",
            authDomain: "budget-cf0cf.firebaseapp.com",
            projectId: "budget-cf0cf",
            storageBucket: "budget-cf0cf.firebasestorage.app",
            messagingSenderId: "841178996844",
            appId: "1:841178996844:web:b54d6f123dadad9e957849",
            measurementId: "G-33TSLKFDK5"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        var auth = firebase.auth();

        // ============================================================
        // GLOBAL STATE
        // ============================================================
        var currentUserId = null;
        var currentUserEmail = null;
        var currentCollection = 'accounts';
        var currentData = [];
        var selectedDocId = null;
        var isEditing = false;
        var quickAddMode = false;

        var COLLECTION_NAMES = {
            accounts: { label: 'Accounts', idField: 'accountId' },
            transactions: { label: 'Transactions', idField: 'transactionId' },
            categories: { label: 'Categories', idField: 'categoryId' }
        };

        var ACCOUNT_TYPES = ['Income', 'Investment', 'Cashflow', 'Temporary', 'Asset', 'Liability'];
        var TRANSACTION_TYPES = ['Credit', 'Debit', 'Outflow'];
        var FREQUENCIES = ['One Time', 'Monthly', 'Quarterly', 'Half-Yearly', 'Yearly', 'On Demand'];

        var DEFAULT_FIELDS = {
            accounts: [
                'accountId', 'accountName', 'accountType', 'frequency',
                'defaultAmount', 'openingBalance', 'currentBalance',
                'targetAmount', 'notes'
            ],
            transactions: [
                'transactionId', 'date', 'accountId', 'category',
                'amount', 'transactionType', 'notes'
            ],
            categories: [
                'categoryId', 'name'
            ]
        };

        function emailToDocumentId(email) {
            if (!email) return "";
            return email.toLowerCase().replace(/@/g, '_').replace(/\./g, '_');
        }

        var loginSection = document.getElementById('loginSection');
        var appContent = document.getElementById('appContent');
        var userDisplay = document.getElementById('userDisplay');
        var authBtn = document.getElementById('authBtn');
        var currentUserEmailEl = document.getElementById('currentUserEmail');
        var currentUserIdEl = document.getElementById('currentUserId');

        function togglePasswordVisibility() {
            var input = document.getElementById('loginPassword');
            var icon = document.querySelector('.password-toggle i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        }

        // ============================================================
        // AUTHENTICATION
        // ============================================================
        function handleSignIn() {
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            if (!email || !password) { errorEl.textContent = 'Please enter both email and password'; return; }

            var signInBtn = document.querySelector('.login-section .btn-primary');
            var originalText = signInBtn.innerHTML;
            signInBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            signInBtn.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .then(function(userCredential) {
                    var user = userCredential.user;
                    currentUserEmail = user.email;
                    currentUserId = emailToDocumentId(user.email);
                    updateAuthUI();
                    showToast('Welcome ' + user.email + '!', 'success');
                    loadCollection();
                    signInBtn.innerHTML = originalText;
                    signInBtn.disabled = false;
                })
                .catch(function(error) {
                    console.error('Sign in error:', error);
                    if (error.code === 'auth/user-not-found') {
                        auth.createUserWithEmailAndPassword(email, password)
                            .then(function(userCredential) {
                                var user = userCredential.user;
                                currentUserEmail = user.email;
                                currentUserId = emailToDocumentId(user.email);
                                updateAuthUI();
                                showToast('Account created for ' + user.email + '!', 'success');
                                loadCollection();
                                signInBtn.innerHTML = originalText;
                                signInBtn.disabled = false;
                            })
                            .catch(function(createError) {
                                errorEl.textContent = 'Could not create account: ' + createError.message;
                                showToast('Auth error: ' + createError.message, 'error');
                                signInBtn.innerHTML = originalText;
                                signInBtn.disabled = false;
                            });
                    } else {
                        errorEl.textContent = 'Sign in failed: ' + error.message;
                        showToast('Auth error: ' + error.message, 'error');
                        signInBtn.innerHTML = originalText;
                        signInBtn.disabled = false;
                    }
                });
        }

        function handleAnonymousSignIn() {
            var errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            auth.signInAnonymously()
                .then(function(userCredential) {
                    var user = userCredential.user;
                    currentUserEmail = 'Guest_' + user.uid.substring(0, 8);
                    currentUserId = 'guest_' + user.uid.substring(0, 8);
                    updateAuthUI();
                    showToast('Signed in as guest', 'info');
                    loadCollection();
                })
                .catch(function(error) {
                    console.error('Anonymous auth error:', error);
                    if (error.code === 'auth/admin-restricted-operation') {
                        errorEl.textContent = 'Anonymous sign-in is not enabled.';
                        showToast('Anonymous sign-in not enabled', 'error');
                    } else {
                        errorEl.textContent = 'Guest sign in failed: ' + error.message;
                        showToast('Guest sign in failed: ' + error.message, 'error');
                    }
                });
        }

        function toggleAuth() {
            if (auth.currentUser) {
                auth.signOut().then(function() {
                    currentUserId = null; currentUserEmail = null;
                    updateAuthUI();
                    showToast('Signed out', 'info');
                    loginSection.style.display = 'block';
                    appContent.style.display = 'none';
                    document.getElementById('fabContainer').style.display = 'none';
                });
            } else {
                loginSection.style.display = 'block';
                appContent.style.display = 'none';
                document.getElementById('fabContainer').style.display = 'none';
            }
        }

        function updateAuthUI() {
            var user = auth.currentUser;
            if (user) {
                var displayName = currentUserEmail || user.email || user.uid || 'User';
                userDisplay.textContent = displayName;
                authBtn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Sign Out';
                authBtn.className = 'btn btn-danger btn-sm';
                loginSection.style.display = 'none';
                appContent.style.display = 'block';
                document.getElementById('fabContainer').style.display = 'flex';
                updateFabVisibility();
                if (currentUserEmailEl) currentUserEmailEl.textContent = currentUserEmail || 'N/A';
                if (currentUserIdEl) currentUserIdEl.textContent = currentUserId || 'N/A';
            } else {
                userDisplay.textContent = 'Not Signed In';
                authBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                authBtn.className = 'btn btn-primary btn-sm';
                loginSection.style.display = 'block';
                appContent.style.display = 'none';
                document.getElementById('fabContainer').style.display = 'none';
                currentUserId = null; currentUserEmail = null;
            }
        }

        auth.onAuthStateChanged(function(user) {
            if (user) {
                if (user.isAnonymous) {
                    currentUserEmail = 'Guest_' + user.uid.substring(0, 8);
                    currentUserId = 'guest_' + user.uid.substring(0, 8);
                } else {
                    currentUserEmail = user.email;
                    currentUserId = emailToDocumentId(user.email);
                }
                updateAuthUI();
                loadCollection();
            } else {
                updateAuthUI();
                document.getElementById('tableContent').innerHTML =
                    '<div class="empty-state"><i class="fas fa-lock"></i><h3>Please Sign In</h3><p>Enter your email and password above to access your data.</p></div>';
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        });

        // ============================================================
        // DATA LOADING
        // ============================================================
        function loadCollection() {
            if (!currentUserId) { showToast('Please sign in first', 'warning'); return; }

            var select = document.getElementById('collectionSelect');
            currentCollection = select.value;

            var info = COLLECTION_NAMES[currentCollection];
            document.getElementById('collectionTitle').textContent = info.label;

            // Update toolbar button label & FAB visibility based on current collection
            updateToolbarButton();
            updateFabVisibility();

            document.getElementById('loadingIndicator').style.display = 'flex';
            document.getElementById('tableContent').innerHTML = '';

            var userRef = db.collection('users').doc(currentUserId);
            userRef.collection(currentCollection).get()
                .then(function(snapshot) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    currentData = [];
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        data._id = doc.id;
                        currentData.push(data);
                    });
                    document.getElementById('rowCount').textContent = currentData.length + ' documents';
                    renderTable(currentData);
                    updateStats();
                })
                .catch(function(error) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    showToast('Error loading data: ' + error.message, 'error');
                    document.getElementById('tableContent').innerHTML =
                        '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#f57c00;"></i><h3>Error</h3><p>' + error.message + '</p></div>';
                });
        }

        // ============================================================
        // TOOLBAR + FAB VISIBILITY
        // ============================================================
        function updateToolbarButton() {
            var label = document.getElementById('toolbarAddLabel');
            var btn = document.getElementById('toolbarAddBtn');
            if (currentCollection === 'accounts') {
                label.textContent = 'Add Account';
                btn.innerHTML = '<i class="fas fa-plus"></i> <span id="toolbarAddLabel">Add Account</span>';
            } else if (currentCollection === 'transactions') {
                label.textContent = 'Add Transaction';
                btn.innerHTML = '<i class="fas fa-plus"></i> <span id="toolbarAddLabel">Add Transaction</span>';
            } else if (currentCollection === 'categories') {
                label.textContent = 'Add Category';
                btn.innerHTML = '<i class="fas fa-plus"></i> <span id="toolbarAddLabel">Add Category</span>';
            }
        }

        function updateFabVisibility() {
            var container = document.getElementById('fabContainer');
            if (!auth.currentUser) { container.style.display = 'none'; return; }
            container.style.display = 'flex';

            var fabTx = document.getElementById('fabAddTransaction');
            var fabQuick = document.getElementById('fabQuickAdd');
            var fabAcct = document.getElementById('fabAddAccount');

            if (currentCollection === 'accounts') {
                // Accounts view: only Add Account FAB
                fabTx.style.display = 'none';
                fabQuick.style.display = 'none';
                fabAcct.style.display = 'flex';
            } else if (currentCollection === 'transactions') {
                // Ledger view: Add Transaction + Quick Add
                fabTx.style.display = 'flex';
                fabQuick.style.display = 'flex';
                fabAcct.style.display = 'none';
            } else {
                // Categories view: hide all (or keep hidden)
                fabTx.style.display = 'none';
                fabQuick.style.display = 'none';
                fabAcct.style.display = 'none';
            }
        }

        // ============================================================
        // RENDER TABLE
        // ============================================================
        function renderTable(data) {
            var container = document.getElementById('tableContent');
            if (data.length === 0) {
                container.innerHTML =
                    '<div class="empty-state"><i class="fas fa-database"></i><h3>No Documents Found</h3><p>Click the green button to create your first document.</p></div>';
                return;
            }

            var info = COLLECTION_NAMES[currentCollection];
            var idField = info.idField;

            var allKeys = new Set();
            data.forEach(function(item) { Object.keys(item).forEach(function(key) { allKeys.add(key); }); });
            allKeys.delete('_id'); allKeys.delete('createdAt'); allKeys.delete('updatedAt');

            var keys = Array.from(allKeys).slice(0, 8);
            var html = '<table><thead><tr><th>Document ID</th>';
            keys.forEach(function(k) { html += '<th>' + k + '</th>'; });
            html += '<th style="text-align:center;">Actions</th></tr></thead><tbody>';

            data.forEach(function(item) {
                var docId = item._id || item[idField] || 'N/A';
                html += '<tr><td><span class="doc-id">' + docId + '</span></td>';
                keys.forEach(function(k) {
                    var val = item[k];
                    if (val === undefined || val === null) val = '';
                    if (typeof val === 'boolean') val = val ? '✅' : '❌';
                    if (typeof val === 'object') val = JSON.stringify(val).substring(0, 50);
                    if (typeof val === 'string' && val.length > 50) val = val.substring(0, 50) + '...';

                    if (k === 'accountType' && val) {
                        html += '<td><span class="type-badge ' + String(val).toLowerCase() + '">' + val + '</span></td>';
                    } else if (k === 'transactionType' && val) {
                        html += '<td><span class="type-badge ' + String(val).toLowerCase() + '">' + val + '</span></td>';
                    } else {
                        html += '<td>' + val + '</td>';
                    }
                });
                html += '<td style="text-align:center;"><div class="table-actions">';
                html += '<button class="btn-icon edit" onclick="editDocument(\'' + docId + '\')"><i class="fas fa-edit"></i></button>';
                html += '<button class="btn-icon delete" onclick="confirmDelete(\'' + docId + '\')"><i class="fas fa-trash"></i></button>';
                html += '</div></td></tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function filterTable() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            if (!search) { renderTable(currentData); return; }
            var filtered = currentData.filter(function(item) {
                return Object.values(item).some(function(val) {
                    if (val === null || val === undefined) return false;
                    return String(val).toLowerCase().includes(search);
                });
            });
            renderTable(filtered);
        }

        // ============================================================
        // STATS — Net Worth breakdown (matches app Dashboard)
        // Net Worth = (Investment + Asset + Cashflow) - Liability
        // Temporary tracked separately, NOT in net worth.
        // ============================================================
        function updateStats() {
            if (!currentUserId) return;
            var userRef = db.collection('users').doc(currentUserId);

            userRef.collection('accounts').get().then(function(snap) {
                var investment = 0, asset = 0, liability = 0, cashflowBalance = 0, temporaryBalance = 0;

                snap.forEach(function(doc) {
                    var a = doc.data();
                    var bal = a.currentBalance || 0;
                    switch (a.accountType) {
                        case 'Investment': investment += bal; break;
                        case 'Asset': asset += bal; break;
                        case 'Liability': liability += bal; break;
                        case 'Cashflow': cashflowBalance += bal; break;
                        case 'Temporary': temporaryBalance += bal; break;
                        // Income contributes nothing to net worth, same as app
                    }
                });

                var netWorth = (investment + asset + cashflowBalance) - liability;

                document.getElementById('investmentTotal').textContent = '₹' + investment.toLocaleString('en-IN');
                document.getElementById('assetTotal').textContent = '₹' + asset.toLocaleString('en-IN');
                document.getElementById('cashflowTotal').textContent = '₹' + cashflowBalance.toLocaleString('en-IN');
                document.getElementById('liabilityTotal').textContent = '₹' + liability.toLocaleString('en-IN');
                document.getElementById('temporaryTotal').textContent = '₹' + temporaryBalance.toLocaleString('en-IN');
                document.getElementById('totalAccounts').textContent = snap.size;

                var nwEl = document.getElementById('netWorthValue');
                var nwDelta = document.getElementById('netWorthDelta');
                nwEl.textContent = '₹' + netWorth.toLocaleString('en-IN');
                nwEl.style.color = netWorth >= 0 ? '#1cc88a' : '#e74a3b';
                nwDelta.textContent = netWorth >= 0 ? '▲ Positive' : '▼ Negative';
                nwDelta.style.color = netWorth >= 0 ? '#1cc88a' : '#e74a3b';
            }).catch(function() {});
        }

        // ============================================================
        // MODAL
        // ============================================================
        function showAddModal() {
            if (!currentUserId) { showToast('Please sign in first', 'warning'); return; }
            isEditing = false;
            selectedDocId = null;
            quickAddMode = false;
            document.getElementById('modalTitle').textContent = 'Add New ' + COLLECTION_NAMES[currentCollection].label;
            generateForm(null);
            document.getElementById('modalOverlay').classList.add('active');
        }

        function editDocument(docId) {
            if (!currentUserId) { showToast('Please sign in first', 'warning'); return; }
            isEditing = true;
            selectedDocId = docId;
            quickAddMode = false;
            document.getElementById('modalTitle').textContent = 'Edit ' + COLLECTION_NAMES[currentCollection].label;
            var item = currentData.find(function(d) { return d._id === docId; });
            if (item) {
                generateForm(item);
                document.getElementById('modalOverlay').classList.add('active');
            } else { showToast('Document not found', 'error'); }
        }

        function generateForm(data) {
            var container = document.getElementById('modalBody');
            var fields;
            if (data) {
                fields = Object.keys(data).filter(function(key) {
                    return !['_id', 'createdAt', 'updatedAt'].includes(key);
                });
            } else {
                fields = DEFAULT_FIELDS[currentCollection] || ['id', 'name'];
            }

            var html = '';
            fields.forEach(function(key) {
                var value = data ? (data[key] !== undefined ? data[key] : '') : '';
                var inputType = 'text';
                var options = '';

                if (key === 'accountType') {
                    inputType = 'select';
                    options = '<option value="">Select Type</option>';
                    ACCOUNT_TYPES.forEach(function(t) { options += '<option value="' + t + '"' + (value === t ? ' selected' : '') + '>' + t + '</option>'; });
                } else if (key === 'transactionType') {
                    inputType = 'select';
                    options = '<option value="">Select Type</option>';
                    TRANSACTION_TYPES.forEach(function(t) { options += '<option value="' + t + '"' + (value === t ? ' selected' : '') + '>' + t + '</option>'; });
                } else if (key === 'frequency') {
                    inputType = 'select';
                    options = '<option value="">Select Frequency</option>';
                    FREQUENCIES.forEach(function(t) { options += '<option value="' + t + '"' + (value === t ? ' selected' : '') + '>' + t + '</option>'; });
                } else if (key === 'notes') {
                    inputType = 'textarea';
                } else if (
                    key.toLowerCase().indexOf('amount') !== -1 ||
                    key.toLowerCase().indexOf('balance') !== -1
                ) {
                    inputType = 'number';
                } else if (key === 'date') {
                    inputType = 'date';
                }

                var label = key.replace(/([A-Z])/g, ' $1').replace(/^./, function(str) { return str.toUpperCase(); });
                html += '<div class="form-group"><label>' + label + '</label>';
                if (inputType === 'select') {
                    html += '<select id="field_' + key + '">' + options + '</select>';
                } else if (inputType === 'textarea') {
                    html += '<textarea id="field_' + key + '">' + (value || '') + '</textarea>';
                } else {
                    html += '<input type="' + inputType + '" id="field_' + key + '" value="' + (value || '') + '" ' + (inputType === 'number' ? 'step="any"' : '') + '>';
                }
                html += '</div>';
            });

            container.dataset.fields = JSON.stringify(fields);
            container.innerHTML = html;
        }

        function saveDocument() {
            if (!currentUserId) { showToast('Please sign in first', 'warning'); return; }
            var container = document.getElementById('modalBody');
            var fields = JSON.parse(container.dataset.fields || '[]');
            var data = {};
            fields.forEach(function(key) {
                var el = document.getElementById('field_' + key);
                if (el) {
                    var value = el.value;
                    if (el.type === 'number') { value = parseFloat(value) || 0; }
                    data[key] = value;
                }
            });

            var info = COLLECTION_NAMES[currentCollection];
            var idField = info.idField;
            var docId = data[idField];
            if (!docId) { docId = isEditing ? selectedDocId : null; }
            if (!docId) { showToast('Please provide a document ID (' + idField + ')', 'warning'); return; }

            var userRef = db.collection('users').doc(currentUserId);
            var docRef = userRef.collection(currentCollection).doc(docId);

            if (isEditing) {
                docRef.update(data).then(function() {
                    closeModal();
                    showToast('Document updated successfully!', 'success');
                    loadCollection();
                }).catch(function(error) { showToast('Error updating: ' + error.message, 'error'); });
            } else {
                docRef.set(data).then(function() {
                    closeModal();
                    showToast('Document created successfully!', 'success');
                    loadCollection();
                }).catch(function(error) { showToast('Error creating: ' + error.message, 'error'); });
            }
        }

        function confirmDelete(docId) {
            if (!currentUserId) { showToast('Please sign in first', 'warning'); return; }
            if (confirm('Are you sure you want to delete this document?\n\nID: ' + docId)) {
                var userRef = db.collection('users').doc(currentUserId);
                userRef.collection(currentCollection).doc(docId).delete()
                    .then(function() { showToast('Document deleted successfully', 'success'); loadCollection(); })
                    .catch(function(error) { showToast('Error deleting: ' + error.message, 'error'); });
            }
        }

        function confirmDeleteAll() {
            if (!currentUserId) { showToast('Please sign in first', 'warning'); return; }
            if (confirm('⚠️ WARNING: This will delete ALL documents in the "' + currentCollection + '" collection.\n\nAre you absolutely sure?')) {
                if (confirm('Final confirmation: Click OK to proceed')) {
                    var userRef = db.collection('users').doc(currentUserId);
                    userRef.collection(currentCollection).get()
                        .then(function(snapshot) {
                            var batch = db.batch();
                            snapshot.forEach(function(doc) { batch.delete(doc.ref); });
                            return batch.commit();
                        })
                        .then(function() { showToast('All documents deleted from ' + currentCollection, 'success'); loadCollection(); })
                        .catch(function(error) { showToast('Error deleting: ' + error.message, 'error'); });
                }
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            quickAddMode = false;
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span>' + message +
                '</span><button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-100%)';
                setTimeout(function() { toast.remove(); }, 400);
            }, 5000);
        }

        function refreshData() {
            showToast('Refreshing data...', 'info');
            loadCollection();
        }

        // ============================================================
        // TOOLBAR / FAB ACTIONS
        // ============================================================
        function toolbarAddAction() {
            // Toolbar Add acts on the current collection
            showAddModal();
        }

        // FAB: Add Transaction — switches to transactions view, opens modal
        function fabAddTransaction() {
            if (currentCollection !== 'transactions') {
                document.getElementById('collectionSelect').value = 'transactions';
                currentCollection = 'transactions';
                updateToolbarButton();
                updateFabVisibility();
                // Load the transactions collection then show the add modal
                var userRef = db.collection('users').doc(currentUserId);
                document.getElementById('collectionTitle').textContent = 'Transactions';
                document.getElementById('loadingIndicator').style.display = 'flex';
                document.getElementById('tableContent').innerHTML = '';
                userRef.collection('transactions').get().then(function(snapshot) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    currentData = [];
                    snapshot.forEach(function(doc) { var d = doc.data(); d._id = doc.id; currentData.push(d); });
                    document.getElementById('rowCount').textContent = currentData.length + ' documents';
                    renderTable(currentData);
                    updateStats();
                    showAddModal();
                });
            } else {
                showAddModal();
            }
        }

        // FAB: Quick Add — switches to transactions view in quick-add mode
        function fabQuickAdd() {
            quickAddMode = true;
            if (currentCollection !== 'transactions') {
                document.getElementById('collectionSelect').value = 'transactions';
                currentCollection = 'transactions';
                updateToolbarButton();
                updateFabVisibility();
                var userRef = db.collection('users').doc(currentUserId);
                document.getElementById('collectionTitle').textContent = 'Transactions';
                document.getElementById('loadingIndicator').style.display = 'flex';
                document.getElementById('tableContent').innerHTML = '';
                userRef.collection('transactions').get().then(function(snapshot) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    currentData = [];
                    snapshot.forEach(function(doc) { var d = doc.data(); d._id = doc.id; currentData.push(d); });
                    document.getElementById('rowCount').textContent = currentData.length + ' documents';
                    renderTable(currentData);
                    updateStats();
                    showQuickAddModal();
                });
            } else {
                showQuickAddModal();
            }
        }

        function showQuickAddModal() {
            isEditing = false;
            selectedDocId = null;
            quickAddMode = true;
            document.getElementById('modalTitle').textContent = '⚡ Quick Add Transaction';
            generateForm(null);
            document.getElementById('modalOverlay').classList.add('active');
        }

        // FAB: Add Account — switches to accounts view, opens modal
        function fabAddAccount() {
            if (currentCollection !== 'accounts') {
                document.getElementById('collectionSelect').value = 'accounts';
                currentCollection = 'accounts';
                updateToolbarButton();
                updateFabVisibility();
                var userRef = db.collection('users').doc(currentUserId);
                document.getElementById('collectionTitle').textContent = 'Accounts';
                document.getElementById('loadingIndicator').style.display = 'flex';
                document.getElementById('tableContent').innerHTML = '';
                userRef.collection('accounts').get().then(function(snapshot) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    currentData = [];
                    snapshot.forEach(function(doc) { var d = doc.data(); d._id = doc.id; currentData.push(d); });
                    document.getElementById('rowCount').textContent = currentData.length + ' documents';
                    renderTable(currentData);
                    updateStats();
                    showAddModal();
                });
            } else {
                showAddModal();
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && loginSection.style.display !== 'none') handleSignIn();
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); refreshData(); }
        });

        // ============================================================
        // INIT
        // ============================================================
        setTimeout(function() {
            if (!auth.currentUser) {
                auth.signInAnonymously()
                    .then(function() { updateAuthUI(); showToast('Signed in as guest', 'info'); loadCollection(); })
                    .catch(function(error) {
                        console.warn('Anonymous auth failed:', error);
                        loginSection.style.display = 'block';
                        appContent.style.display = 'none';
                        document.getElementById('fabContainer').style.display = 'none';
                        if (error.code === 'auth/admin-restricted-operation') {
                            document.getElementById('loginError').textContent =
                                '💡 Anonymous sign-in is not enabled. Please use email/password.';
                        }
                        showToast('Please sign in to access your data', 'warning');
                    });
            }
        }, 500);

        // ============================================================
        // EXPOSE FUNCTIONS
        // ============================================================
        window.handleSignIn = handleSignIn;
        window.handleAnonymousSignIn = handleAnonymousSignIn;
        window.toggleAuth = toggleAuth;
        window.togglePasswordVisibility = togglePasswordVisibility;
        window.loadCollection = loadCollection;
        window.filterTable = filterTable;
        window.showAddModal = showAddModal;
        window.editDocument = editDocument;
        window.saveDocument = saveDocument;
        window.confirmDelete = confirmDelete;
        window.confirmDeleteAll = confirmDeleteAll;
        window.closeModal = closeModal;
        window.refreshData = refreshData;
        window.showToast = showToast;
        window.emailToDocumentId = emailToDocumentId;
        window.toolbarAddAction = toolbarAddAction;
        window.fabAddTransaction = fabAddTransaction;
        window.fabQuickAdd = fabQuickAdd;
        window.fabAddAccount = fabAddAccount;

        console.log('✅ Finance Manager Admin Loaded');
        console.log('📁 users/{userId}/{collection}/{docId}');
    </script>

</body>
</html>
